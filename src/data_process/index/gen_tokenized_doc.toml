title = "tokenizing the collection (all passaages) for later embedding generation"


# [Model]
model_type = "ANCE"
pretrained_passage_encoder = "3ricL/ad-hoc-ance-msmarco"   # passage encoder!!!
max_seq_length = 384    # The maximum total input sequence length after tokenization. Sequences longer than this will be truncated, sequences shorter will be padded."
max_doc_character = 10000   # used before tokenizer to save tokenizer latency


# [Input Data]
# Examples:
# raw_collection_path = "data/topiocqa/full_wiki_segments.tsv"
# raw_collection_path = "data/qrecc/qrecc_collection.tsv"
raw_collection_path = "data/cast/cast2019.tsv"


# [Output]
# Examples:
# data_output_path = "data/topiocqa/tokenized"
# data_output_path = "data/qrecc/tokenized"
data_output_path = "data/cast/tokenized"